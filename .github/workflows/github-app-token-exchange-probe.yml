name: Probe GitHub App token exchange

on: workflow_dispatch

jobs:
  token-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify two exchanges in one job
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from time import sleep
          from urllib.error import HTTPError
          from urllib.parse import parse_qsl, urlencode, urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          AUDIENCE = "claude-code-github-action"
          BROKER = "https://api.anthropic.com/api/github/github-app-token-exchange"
          GITHUB_API = "https://api.github.com"
          PERMISSIONS = {"contents": "read", "issues": "read", "pull_requests": "read"}
          MAX_RESPONSE_BYTES = 1024 * 1024


          class ProbeError(Exception):
              pass


          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          opener = build_opener(NoRedirect())


          def request(stage, url, token, *, method="GET", body=None, expected=200):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "github-app-token-exchange-probe",
              }
              if body is not None:
                  headers["Content-Type"] = "application/json"
              if url.startswith(f"{GITHUB_API}/"):
                  headers["Accept"] = "application/vnd.github+json"
                  headers["X-GitHub-Api-Version"] = "2022-11-28"
              try:
                  with opener.open(Request(url, body, headers, method=method), timeout=12) as response:
                      if response.status != expected:
                          raise ProbeError(f"{stage}: unexpected HTTP {response.status}")
                      if expected == 204:
                          return None
                      raw = response.read(MAX_RESPONSE_BYTES + 1)
                      if len(raw) > MAX_RESPONSE_BYTES:
                          raise ProbeError(f"{stage}: response was too large")
                      payload = json.loads(raw)
                      if not isinstance(payload, dict):
                          raise ProbeError(f"{stage}: invalid response")
                      return payload
              except HTTPError as error:
                  error.close()
                  raise ProbeError(f"{stage}: HTTP {error.code}") from None
              except ProbeError:
                  raise
              except Exception:
                  raise ProbeError(f"{stage}: request or response could not be processed") from None


          def runner_request():
              raw_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
              request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")
              url = urlsplit(raw_url)
              if (
                  url.scheme != "https"
                  or not url.hostname
                  or url.username is not None
                  or url.password is not None
                  or url.fragment
                  or not request_token
                  or any(key == "audience" for key, _ in parse_qsl(url.query))
              ):
                  raise ProbeError("The runner did not supply usable OIDC request credentials")
              audience = urlencode({"audience": AUDIENCE})
              query = f"{url.query}&{audience}" if url.query else audience
              return url._replace(query=query).geturl(), request_token


          def verified_token(number, assertion, issued_tokens, repository):
              payload = request(
                  f"Exchange {number}", BROKER, assertion, method="POST",
                  body=json.dumps({"permissions": PERMISSIONS}).encode("utf-8"),
              )
              returned_tokens = {
                  value for key in ("token", "app_token")
                  if isinstance(value := payload.get(key), str) and value
              }
              issued_tokens.update(returned_tokens)
              if len(returned_tokens) != 1:
                  raise ProbeError(f"Exchange {number}: missing or ambiguous installation token")
              token, = returned_tokens
              data = request(
                  f"Verify token {number}", f"{GITHUB_API}/installation/repositories?per_page=1", token,
              )
              repositories = data.get("repositories")
              if not isinstance(repositories, list) or not any(
                  isinstance(item, dict) and str(item.get("full_name", "")).casefold() == repository
                  for item in repositories
              ):
                  raise ProbeError(f"Verify token {number}: this repository was not returned")
              print(f"Exchange {number}: installation token authenticated", flush=True)
              return token


          def main():
              issued_tokens = set()
              failed = False
              outcome = None
              try:
                  repository = os.environ["GITHUB_REPOSITORY"].casefold()
                  oidc_url, runner_token = runner_request()
                  first_assertion = request("Request OIDC assertion 1", oidc_url, runner_token).get("value")
                  if not isinstance(first_assertion, str) or not first_assertion:
                      raise ProbeError("Runner returned no OIDC assertion for exchange 1")
                  first = verified_token(1, first_assertion, issued_tokens, repository)

                  sleep(2)
                  second_assertion = request("Request OIDC assertion 2", oidc_url, runner_token).get("value")
                  if not isinstance(second_assertion, str) or not second_assertion:
                      raise ProbeError("Runner returned no OIDC assertion for exchange 2")
                  if second_assertion == first_assertion:
                      outcome = "INCONCLUSIVE: the runner returned the same OIDC assertion"
                  else:
                      second = verified_token(2, second_assertion, issued_tokens, repository)
                      if first == second:
                          outcome = "INCONCLUSIVE: both exchanges returned the same installation token"
                      else:
                          outcome = "PASS: two distinct installation tokens authenticated in one job"
              except ProbeError as error:
                  print(f"FAIL: {error}", flush=True)
                  failed = True
              except Exception:
                  print("FAIL: unexpected probe error", flush=True)
                  failed = True
              finally:
                  revoked = 0
                  for token in issued_tokens:
                      try:
                          request(
                              "Revoke installation token", f"{GITHUB_API}/installation/token", token,
                              method="DELETE", expected=204,
                          )
                          revoked += 1
                      except ProbeError as error:
                          print(f"FAIL: {error}", flush=True)
                          failed = True
                      except Exception:
                          print("FAIL: unexpected token revocation error", flush=True)
                          failed = True
                  print(f"Revoked {revoked} of {len(issued_tokens)} issued installation tokens", flush=True)
              if not failed:
                  print(outcome, flush=True)
              return int(failed)


          raise SystemExit(main())
          PY
